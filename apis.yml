name: Didi
description: >-
  DiDi Global is a mobility technology platform best known for ride-hailing,
  taxi-hailing, and enterprise employee travel across China and international
  markets. DiDi exposes a public developer surface through DiDi Enterprise
  Services (DDES) — an Open API for corporate travel management covering approval
  workflows, bills, budget/cost centers, orders, single sign-on, users, roles,
  and company entities. The DDES API (base URL https://api.es.xiaojukeji.com) is
  documented at opendocs.xiaojukeji.com/version2024, secured with OAuth 2.0
  client_credentials plus per-request signing, and shipped with official Java
  and Go SDKs under the github.com/didi organization. DiDi is backed by
  Hillhouse and the SoftBank Vision Fund.
